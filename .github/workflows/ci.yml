name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.7
          bundler-cache: true
          working-directory: api

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager --no-exit-on-warn

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.7
          bundler-cache: true
          working-directory: api

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('api/.ruby-version', 'api/.rubocop.yml', 'api/Gemfile.lock') }}
        with:
          path: api/tmp/rubocop
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test_api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install packages
        working-directory: .
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.7
          bundler-cache: true
          working-directory: api

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/api_test
          DEVISE_JWT_SECRET_KEY: test-jwt-secret-key-for-ci-only-not-used-in-production
          MIN_COVERAGE: "65"
        run: |
          bin/rails db:test:prepare
          bundle exec rspec --format progress

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_API_URL: http://localhost:3000
          VITE_GRAPHQL_ENDPOINT: /graphql
          VITE_GOOGLE_CLIENT_ID: test-client-id
        run: npm run build

deploy_api:
  runs-on: ubuntu-latest
  needs: [scan_ruby, lint, test_api, frontend]
  if: github.ref == 'refs/heads/main' && github.event_name == 'push'

  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Deploy API to Heroku
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        HEROKU_APP: studio-flow-api
      run: |
        set -euo pipefail

        if [ -z "$HEROKU_API_KEY" ]; then
          echo "❌ HEROKU_API_KEY secret is not set"; exit 1
        fi

        echo "📦 Creating API tarball..."
        tar czf /tmp/api.tar.gz \
          --exclude='.git' --exclude='node_modules' \
          --exclude='tmp/cache' --exclude='tmp/pids' \
          --exclude='log' --exclude='spec' --exclude='coverage' \
          -C api .
        echo "Tarball size: $(du -sh /tmp/api.tar.gz | cut -f1)"

        echo "🔗 Requesting signed source URLs..."
        HTTP_CODE=$(curl -s -o /tmp/source.json -w "%{http_code}" \
          -X POST https://api.heroku.com/sources \
          -H "Authorization: Bearer $HEROKU_API_KEY" \
          -H "Accept: application/vnd.heroku+json; version=3" \
          -H "Content-Type: application/json")
        [ "$HTTP_CODE" == "200" ] || [ "$HTTP_CODE" == "201" ] || { cat /tmp/source.json; exit 1; }

        PUT_URL=$(jq -r '.source_blob.put_url' /tmp/source.json)
        GET_URL=$(jq -r '.source_blob.get_url' /tmp/source.json)

        echo "⬆️  Uploading tarball..."
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
          -X PUT -H "Content-Type:" --data-binary @/tmp/api.tar.gz "$PUT_URL")
        [ "$HTTP_CODE" == "200" ] || { echo "❌ Upload failed (HTTP $HTTP_CODE)"; exit 1; }

        echo "🚀 Triggering Heroku build..."
        HTTP_CODE=$(curl -s -o /tmp/build.json -w "%{http_code}" \
          -X POST "https://api.heroku.com/apps/$HEROKU_APP/builds" \
          -H "Authorization: Bearer $HEROKU_API_KEY" \
          -H "Accept: application/vnd.heroku+json; version=3" \
          -H "Content-Type: application/json" \
          -d "{\"source_blob\":{\"url\":\"$GET_URL\",\"version\":\"$(git rev-parse --short HEAD)\"}}") 
        [ "$HTTP_CODE" == "200" ] || [ "$HTTP_CODE" == "201" ] || { cat /tmp/build.json; exit 1; }

        BUILD_ID=$(jq -r '.id' /tmp/build.json)
        echo "✅ Build started: $BUILD_ID"

        echo "⏳ Polling build status..."
        while true; do
          sleep 15
          RESULT=$(curl -s "https://api.heroku.com/apps/$HEROKU_APP/builds/$BUILD_ID" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -H "Accept: application/vnd.heroku+json; version=3")
          STATUS=$(echo "$RESULT" | jq -r '.status')
          echo "  status: $STATUS"
          case "$STATUS" in
            succeeded) echo "✅ API deployed!"; break ;;
            failed)
              echo "❌ API deploy failed!"
              curl -s "$(echo "$RESULT" | jq -r '.output_stream_url // empty')" | tail -40
              exit 1 ;;
          esac
        done
