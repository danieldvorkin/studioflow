[build]
base = "web"
command = "npm run build"
publish = "dist"
# Builds triggered by GitHub Actions only — block Netlify's auto-deploy
ignore = "exit 0"

[build.environment]
NODE_VERSION = "20"

# SPA fallback — all routes serve index.html
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Security headers
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets (JS/CSS bundles — content-hashed)
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Cache icon PNGs / SVG long-term (versioned via filename when updated)
[[headers]]
for = "/*.png"
[headers.values]
Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
for = "/*.svg"
[headers.values]
Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
for = "/*.ico"
[headers.values]
Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Web app manifest — short cache so theme/icon updates are picked up quickly
[[headers]]
for = "/manifest.webmanifest"
[headers.values]
Content-Type = "application/manifest+json"
Cache-Control = "public, max-age=86400"

# Production
[context.production]
command = "npm run build"

[context.production.environment]
VITE_API_URL = "https://studio-flow-api-ef82a5decb61.herokuapp.com"

# Preview deploys (PRs)
[context.deploy-preview]
command = "npm run build"

[context.deploy-preview.environment]
VITE_API_URL = "https://studio-flow-api-ef82a5decb61.herokuapp.com"
